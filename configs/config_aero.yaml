# Where to put checkpoints, logs, and a copy of this config
output_dir: runs/test_run
seed: 1337

# Path to the data config file (relative to configs/ directory)
# Switch to conf_data_val.yaml for validation runs
data_config: config_data.yaml

# Accelerate initialization kwargs
accelerator:
    mixed_precision: bf16
    split_batches: False
    gradient_accumulation_steps: 4
    device_placement: True
    sync_batchnorm: False

model:
    _target_: models.video_net.UNetModel3D
    in_channels: 1
    out_channels: 1
    cond_channels: 2
    dim_mults: [1, 2, 3, 4]
    resnet_groups: 8
    attn_dim_head: 32
    attn_heads: 8
    init_kernel_size: 7
    model_dim: 96

scheduler:
    _target_: custom_diffusers.continuous_ddpm.ContinuousDDPM
    beta_schedule: linear
    prediction_type: v_prediction
    clip_sample: false
    clip_range:
      - 4.5
      - 3.5

trainer:
  _target_: trainer.unetTrainer.UNetTrainer

  hyperparameters:
    max_epochs: 10000
    sample_every: 500
    save_every: 100
    batch_size: 12       # must match batch_size in conf_data.yaml
    save_dir: runs/
    save_name: run_per-channel-cfg.pt
    load_path: "newest"   # "0" = train from scratch, "newest" = auto-load latest checkpoint, or explicit path
    lr: 0.00005
    sample_steps: 250
    cfg_drop_prob: 0.1
    cfg_co2_drop_prob: 0.1
    cfg_sul_drop_prob: 0.1
    eval_script: run_eval_aero.sh

  optimizer:
    _target_: torch.optim.Adam
    _partial_: True
    betas: [0.9, 0.999]