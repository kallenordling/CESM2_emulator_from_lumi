# Where to put checkpoints, logs, and a copy of this config
output_dir: runs/test_run
seed: 1337

# Path to the data config file (relative to configs/ directory)
# Switch to conf_data_val.yaml for validation runs
data_config: config_data.yaml

# Accelerate initialization kwargs
accelerator:
    mixed_precision: bf16
    split_batches: False
    gradient_accumulation_steps: 2
    device_placement: True
    sync_batchnorm: False

model:
    _target_: models.video_net.UNetModel3D
    in_channels: 1
    out_channels: 1
    cond_channels: 2
    dim_mults: [1, 2, 3, 4]
    resnet_groups: 8
    attn_dim_head: 32
    attn_heads: 8
    init_kernel_size: 7
    model_dim: 96

scheduler:
    _target_: custom_diffusers.continuous_ddpm.ContinuousDDPM
    beta_schedule: linear
    prediction_type: v_prediction
    clip_sample: false
    clip_range:
      - 4.5
      - 3.5

trainer:
  _target_: trainer.unetTrainer.UNetTrainer

  hyperparameters:
    max_epochs: 10000
    sample_every: 500
    save_every: 100
    batch_size: 8        # must match batch_size in conf_data.yaml; lowered from 12 to fit TCRE extra forward pass
    save_dir: runs/
    save_name: run_per-channel-cfg.pt
    load_path: "newest"   # "0" = train from scratch, "newest" = auto-load latest checkpoint, or explicit path
    lr: 0.00005
    sample_steps: 250
    cfg_drop_prob: 0.1
    cfg_co2_drop_prob: 0.2      # increased from 0.1 — more null-CO2 batches, less CO2 sensitivity
    cfg_sul_drop_prob: 0.3      # 3× SUL dropout → more CO2-only training batches
    co2_cond_loss_scaling: 0.03  # initial value; overridden by adaptive scaling once EMAs warm up
    adaptive_loss_scaling: true  # auto-tune all cond scalings to fixed fractions of MSE loss
    co2_target_fraction: 0.10    # CO2 conditioning loss target = 10% of MSE loss
    cond_target_fraction: 0.30   # general conditioning loss target = 30% of MSE loss (bounded [0.1, 0.4])
    # ── TCRE regularization (physics prior) ──────────────────────────────
    # Penalizes scenario-averaged gmean(ΔT_from_CO2) deviating from a linear
    # TCRE relation fit on GHG training data. Applied to hist + ssp370 + ghg.
    # Adds ~25-33% training overhead (extra CO2-only forward pass for that subset).
    tcre_loss_scaling: 0.01      # initial value; adaptive scaling overrides once EMA warms
    tcre_target_fraction: 0.05   # TCRE loss target = 5% of MSE loss (bounded [0.001, 0.5])
    reset_optimizer: true       # reset Adam state so old CO2-loss momentum doesn't persist
    eval_script: run_eval_aero.sh

  optimizer:
    _target_: torch.optim.Adam
    _partial_: True
    betas: [0.9, 0.999]