# Where to put checkpoints, logs, and a copy of this config
defaults:
  - _self_
  - conf_data   # pulls in configs/conf_data.yaml, merges under `data:`

output_dir: runs/test_run
seed: 1337

# Accelerate initialization kwargs (see HuggingFace Accelerate)
accelerator:
    mixed_precision: bf16
    split_batches: False
    gradient_accumulation_steps: 9
    device_placement: True
    sync_batchnorm: True

# data: block is now fully defined in conf_data.yaml

model:
    _target_: models.video_net.UNetModel3D
    in_channels: 1
    out_channels: 1
    cond_channels: 2
    cond_drop_prob: 0.1
    dim_mults: [0.75, 2, 3, 4, 8]
    resnet_groups: 8
    attn_dim_head: 32
    attn_heads: 8
    init_kernel_size: 7
    model_dim: 64

scheduler:
    _target_: custom_diffusers.continuous_ddpm.ContinuousDDPM
    beta_schedule: linear
    prediction_type: v_prediction
    clip_sample: false
    clip_range:
      - 4.5
      - 3.5

trainer:
  _target_: trainer.unetTrainer.UNetTrainer

  hyperparameters:
    max_epochs: 10000
    sample_every: 500
    save_every: 100
    batch_size: 8        # must match data.batch_size — 4 scenarios × 2
    save_dir: runs/
    save_name: run_multi_experiment.pt
    load_path: 0
    lr: 0.00002
    sample_steps: 250


  optimizer:
    _target_: torch.optim.Adam
    _partial_: True
    betas: [0.9, 0.99]