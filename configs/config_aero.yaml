# Where to put checkpoints, logs, and a copy of this config
output_dir: runs/test_run
seed: 1337

# Path to the data config file (relative to configs/ directory)
# Switch to conf_data_val.yaml for validation runs
data_config: config_data.yaml

# Accelerate initialization kwargs
accelerator:
    mixed_precision: bf16
    split_batches: False
    gradient_accumulation_steps: 2
    device_placement: True
    sync_batchnorm: False

model:
    _target_: models.video_net.UNetModel3D
    in_channels: 1
    out_channels: 1
    cond_channels: 2
    dim_mults: [1, 2, 3, 4]
    resnet_groups: 8
    attn_dim_head: 32
    attn_heads: 8
    init_kernel_size: 7
    model_dim: 96

scheduler:
    _target_: custom_diffusers.continuous_ddpm.ContinuousDDPM
    beta_schedule: linear
    prediction_type: v_prediction
    clip_sample: false
    clip_range:
      - 4.5
      - 3.5

trainer:
  _target_: trainer.unetTrainer.UNetTrainer

  hyperparameters:
    max_epochs: 10000
    sample_every: 500
    save_every: 100
    batch_size: 8        # must match batch_size in config_data.yaml
    save_dir: runs/
    save_name: run_slope-tcre.pt
    load_path: "newest"        # "0" = train from scratch, "newest" = auto-load latest checkpoint, or explicit path
    lr: 0.00005
    sample_steps: 250
    cfg_drop_prob: 0.0
    cfg_co2_drop_prob: 0.2      # increased from 0.1 — more null-CO2 batches, less CO2 sensitivity
    cfg_sul_drop_prob: 0.3      # 3× SUL dropout → more CO2-only training batches
    adaptive_loss_scaling: true  # auto-tune cond/tcre scalings to fixed fractions of MSE loss
    cond_target_fraction: 0.30   # general conditioning loss target = 30% of MSE loss (bounded [0.1, 0.4])
    # ── TCRE regularization (physics prior) ──────────────────────────────
    # Slope precomputed from hist + ssp370 ΔT vs cumCO2 (matches eval).
    # Applied to the model's full predicted anomaly on hist + ssp370 samples.
    tcre_loss_scaling: 0.01      # initial value; adaptive scaling overrides once EMA warms
    tcre_target_fraction: 0.05
    # ── Energy-balance constraint  N = F + λ·ΔT,  F = F_ghg + F_aero ─────
    # Three learnable scalars (α_ghg, α_aero, λ) penalize the squared
    # global-mean residual.  Ties SUL to ΔT alongside CO2; complements TCRE
    # which only constrains CO2.  Scaling adapts via EMA toward target_fraction.
    ebm_loss_scaling: 0.01
    ebm_target_fraction: 0.05
    # ── Superposition (interaction) penalty  (strategy #2, ssp126 fix) ────
    # Enforces additive CO2+aerosol composition on hist (low-forcing) so the
    # model composes unseen low-forcing scenarios (ssp126) from its marginals
    # instead of over-warming when aerosols decline. 2 extra no-grad marginal
    # passes on the hist subset each sync step. Scaling adapts via EMA.
    interaction_loss_scaling: 0.01      # initial; adaptive scaling overrides once EMA warms
    interaction_target_fraction: 0.05
    # PROTOTYPE (option 1, ssp126): also enforce additivity on a declining-aerosol
    # synthetic (SUL scaled toward null by a random retained-fraction in [frac,1])
    # for CO2-bearing samples — the high→low aerosol regime ssp126 traverses but
    # hist/ssp370 don't. 0.0 = off. Adds ONE extra grad forward pass per sync step
    # (~slower; watch DDP). Try 0.2 to enable; set 0.0 to disable.
    interaction_decline_frac: 0.0
    reset_optimizer: false      # keep Adam momentum across resumes — required for short chained jobs (run2_aero.sh self-chaining). Set true only for a one-off momentum reset after a loss-function change.
    eval_script: run_eval_aero.sh

  optimizer:
    _target_: torch.optim.Adam
    _partial_: True
    betas: [0.9, 0.999]