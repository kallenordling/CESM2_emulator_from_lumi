# VARIANT: NO PCA on the conditioning. smooth -> normalize -> model.
# conf/dataset/multi_experiment_train.yaml
# ============================================================
#  Multi-experiment training dataloader config
#  Scenarios : hist, ssp370, AAER, GHG
#  Realizations : 21 / 30  (70 % train split)
#  Batch : 16 total = 4 windows × 4 scenarios per batch
# ============================================================
#
# A/B FORK (2026-08-03, run_mseyb_BCprect.sh): completes the 2×2 factorial on
# the ssp370 warm+wet bias investigation (see memory
# gainfix_ssp370_persistent_bias.md). We have:
#   run_mseyb        : mse_only=true, year_bias=1.0, 2 cond / 1 target — CLEAN (no bias)
#   run_gainfix       : full aux losses + SGAIN + LR decay, 3 cond / 2 target — BIASED
#   run_gainfix_noBCprect (pending): full aux losses + SGAIN + LR decay, 2 cond / 1 target
#   run_mseyb_BCprect (this fork) : mse_only=true, year_bias=1.0, 3 cond / 2 target
# This is the mirror-image cell: takes run_mseyb's exact training philosophy
# (no TCRE/SGAIN/interaction losses at all, year-biased sampling, constant LR)
# and adds BACK the BC cond channel + PRECT target channel, changing NOTHING
# else. If this run reproduces the ssp370 warm bias, BC/PRECT contributes
# regardless of loss config. If it stays clean like run_mseyb, channels are
# not the driver under EITHER loss regime, and the bias is specific to the
# aux-loss/SGAIN/LR-decay machinery itself.
#
# Byte-identical to config_data_ybias.yaml (scenario_weights [2,2,4,1],
# year_bias 1.0, year_bias_floor 0.1, bsp_depth 0, realizations) except
# target_vars/cond_vars (+PRECT/+BC), cond_smooth_sigma
# (3-length), and data_dir/cond_file (paired TREFHT+PRECT trees, *_bc.nc cond
# files — same as config_data.yaml; BC var read from the same _bc.nc files
# run_gainfix already uses).

_target_: multi_experiment_dataset.build_multi_experiment_loader

# ── Shared ClimateDataset kwargs ─────────────────────────────
seq_len: 1
target_vars:
  - TREFHT
  - PRECT                     # added for this fork — see header
cond_vars:
  - CO2
  - SUL
  - BC                        # added for this fork — see header
# Pipeline, training AND eval (the only one, since the 2026-10-01 cleanup):
#     cond_file -> gaussian smooth (raw units) -> min/max normalize -> model
# anchored on hist+ssp370, no clip, no PCA.
#
# Dropping PCA removes the 5-EOF bottleneck and with it the reconstruction
# ringing that pushed cells below -1 (a projection does not preserve the
# non-negativity of an emission field). It also removes what PCA was doing
# for us: the 5-EOF SUL reconstruction dropped the CEDS->IAMC 2015 junction
# texture, which now reaches the model. Smoothing is therefore the ONLY
# denoiser left, which is why all three channels are at sigma 4 here rather
# than the paper's [0,2,2] -- CO2 unsmoothed AND unprojected would be raw
# point-source inventory.
# Per-channel spatial gaussian σ (gridpoints) applied to normalised cond fields
# before PCA. CO2 is already smooth (cumulative emissions); SUL needs smoothing
# to suppress shipping-lane/flight-path inventory artefacts that the model would
# otherwise reproduce as line features in the predicted TREFHT.
# CO2 SMOOTHED TOO in this variant (2026-09-17). The comment above says CO2 is
# already smooth -- true while v1 CLIPS it at +1. Without the clip (v1_noclip)
# single CO2 cells reach +hundreds and imprinted grid-scale speckle on TREFHT
# (pattern r 0.57, roughness tracking the CO2 input). Everything else is
# identical to config_data_ybias_BCprect.yaml.
cond_smooth_sigma: [1, 1, 1]   # [CO2, SUL, BC] — SIGMA SWEEP arm
# Generated by the 2026-10-02 sigma sweep. sigma 0 means NO smoothing:
# smooth_cond_spatial leaves a channel with sigma<=0 untouched, and the
# min/max anchors are then fitted on the RAW field, where one unsmoothed
# hotspot sets the ceiling. Every sigma gets its own anchors, so these
# arms are not comparable to each other except through the trained model.
# ALL-CHANNEL variant (2026-09-21). smooth4 widened CO2 only, on the
# argument that widening SUL/BC too would blur the aerosol fingerprint and
# confound the test. The maps then showed the artefact sitting on emitting
# land generally rather than only where CO2 dominates, so SUL/BC at sigma 2
# cannot be ruled out as contributors. This arm widens all three: if it
# beats smooth4 the aerosols were contributing; if it matches, CO2 was the
# whole story and what remains is AMPLITUDE, not texture. Known risk: a
# wider gaussian on SUL/BC also erases regional aerosol structure (see
# cond_smooth_method comment below and model_skill_diagnosis).
# WIDER-GAUSSIAN variant of the co2smooth arm (2026-09-18). co2smooth uses
# sigma 2 on CO2; this uses 4. Measured on the ssp370 CO2 channel under
# v1_noclip: mean grid-scale texture 0.308 (sigma 0) -> 0.036 (sigma 2) ->
# 0.010 (sigma 4), while E China's regional amplitude retains 96% at sigma 2
# and 86% at sigma 4. So 4 buys ~3.5x less texture for ~10% more regional
# amplitude. SUL/BC deliberately STAY at 2: widening them too would also
# blur the aerosol fingerprint (a known failure mode) and would confound
# this test, whose ONLY variable against co2smooth is the CO2 channel.
# Denoiser for the smoothing above: "gaussian" (blurs all scales — also erases
# the regional aerosol fingerprint, see model_skill_diagnosis: aaer patcorr 0.42)
# or "median" (k=2*round(sigma)+1 kernel; removes thin shipping/flight lines but
# preserves broad continental aerosol structure). Production = gaussian.
cond_smooth_method: gaussian

# ── Loader settings ──────────────────────────────────────────
batch_size: 8           # 16→8: per_exp=2 (vs 4) so n_batches doubles → ≥16/realization for 16-rank DDP sharding
mix_scenarios: true    # guarantees cross-scenario batches (critical for conditioning)
steps_per_realization: 1000  # fewer realization switches = less Lustre I/O stalling GPUs

# ── Per-scenario sampling weights — IDENTICAL to config_data_ybias.yaml ──────
scenario_weights:
  - 2  # hist
  - 2  # ssp370
  - 4  # aaer
  - 1  # ghg

# ── Year-biased window sampling — IDENTICAL to config_data_ybias.yaml ────────
year_bias: 1.0          # MSE+ybias arm: up-weight high-emission years (vs 0.0 uniform). Floor 0.1 → late ~10x early.
year_bias_floor: 0.1

# ── BSP (binary-space-partition) period sampler — IDENTICAL ──────────────────
bsp_depth: 0

# ── Per-experiment configs ────────────────────────────────────
# data_dir is now a LIST (TREFHT + PRECT trees, paired by realization dir
# name — same convention as config_data.yaml). cond_file switched to the
# *_bc.nc variants (contain BC; CO2/SUL values identical to the non-bc files
# used by config_data_ybias.yaml).
