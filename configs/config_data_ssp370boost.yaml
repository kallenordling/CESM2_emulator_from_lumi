# conf/dataset/multi_experiment_train.yaml
# ============================================================
#  Multi-experiment training dataloader config
#  Scenarios : hist, ssp370, AAER, GHG
#  Realizations : 21 / 30  (70 % train split)
#  Batch : 16 total = 4 windows × 4 scenarios per batch
# ============================================================

_target_: multi_experiment_dataset.build_multi_experiment_loader

# ── Shared ClimateDataset kwargs ─────────────────────────────
seq_len: 1
target_vars:
  - TREFHT
  - PRECT                     # NEW — 2nd output channel (precip, mm/day, log1p+z-score normalised)
cond_vars:
  - CO2
  - SUL
  - BC                        # NEW — 3rd cond channel (black carbon, annual combustion emissions like SUL)
n_components_target: null
n_components_cond: [30, 5, 5] # [CO2, SUL, BC]: BC shares SUL's combustion geography → 5 EOFs (drops the CEDS↔IAMC 2015-junction EOF, same as SUL)
# Per-channel spatial gaussian σ (gridpoints) applied to normalised cond fields
# before PCA. CO2 is already smooth (cumulative emissions); SUL needs smoothing
# to suppress shipping-lane/flight-path inventory artefacts that the model would
# otherwise reproduce as line features in the predicted TREFHT.
cond_smooth_sigma: [0, 2, 2]   # [CO2, SUL, BC]: BC has the same shipping-lane/flight-path inventory artefacts as SO2 → σ=2
# Denoiser for the smoothing above: "gaussian" (blurs all scales — also erases
# the regional aerosol fingerprint, see model_skill_diagnosis: aaer patcorr 0.42)
# or "median" (k=2*round(sigma)+1 kernel; removes thin shipping/flight lines but
# preserves broad continental aerosol structure). Production = gaussian.
cond_smooth_method: gaussian

# ── Loader settings ──────────────────────────────────────────
batch_size: 8           # 16→8: per_exp=2 (vs 4) so n_batches doubles → ≥16/realization for 16-rank DDP sharding
mix_scenarios: true    # guarantees cross-scenario batches (critical for conditioning)
steps_per_realization: 1000  # fewer realization switches = less Lustre I/O stalling GPUs

# ── Per-scenario sampling weights ────────────────────────────
# #3 low-forcing rebalance: hist weighted 2× to over-sample the LOW cumulative-
# CO2 regime, which the model over-warms (hist +51%, ssp126 +103% TCRE) and
# which is under-represented relative to its leverage on ssp126. hist spans
# cumCO2 ~0→moderate, so it anchors the low end of the per-scenario TCRE slope
# loss. ssp370 still seen every batch for the high-CO2 anchor.
#
# #4 aerosol rebalance (2026-05-23): aaer 1→4 weight. The base chain progressively
# UNLEARNS the aerosol fingerprint that it HAD learned (aaer patcorr 0.80@ep350 →
# 0.08@ep470) as the slope-match/hist-upweight pressure pulls it off aerosols. The
# aaer-upweight A/B (run_aaertest, same-epoch control at ep470) recovered it:
# patcorr 0.08→0.79, aaer GMbias +0.93→−0.04, hist patcorr 0.71→0.93 — so the
# aerosol response is WEIGHT-limited, not data-limited. (ssp126 stayed +136% TCRE
# → it's OOD, not a marginal problem; see model_skill_diagnosis /
# ssp126_convex_response_fix.)
#
# CHOSEN [2,2,4,1] over the proven [2,1,4,1]: at 4× aaer the A/B HALVED ssp370's
# batch share and doubled its warm bias (GMbias +0.23→+0.51; pattern unaffected,
# 0.99). Bumping ssp370 to 2 protects it. With batch_size=8 (largest-remainder):
# [2,2,4,1] → hist=2, ssp370=2, aaer=3, ghg=1. Net vs old [2,1,1,1] (=hist3,
# ssp370 2, aaer2, ghg1): aaer 2→3, hist 3→2, ssp370 held at 2.
# CAVEATS: (a) aaer lands at 3/8, NOT the A/B-proven 4/8 → recovery may be partial
# (somewhere between 0.08 and 0.79); re-eval aaer patcorr after ~30-50 epochs.
# (b) hist drops one slot (3→2) → slightly weaker low-forcing TCRE anchor; watch
# hist/ssp126 TCRE ratios don't creep back up.
#
# A/B FORK (2026-07-22, run_gainfix_ssp370boost.sh): the run_gainfix persistent
# ssp370 warm+wet bias (GMbias +0.15..+0.29, see gainfix_ssp370_bias investigation)
# sits in the range the [2,2,4,1] comment above already attributes to ssp370's
# batch-share squeeze by the aaer upweight. This fork gives ssp370 back one slot
# from aaer ([2,3,3,1] → hist=2, ssp370=2-3, aaer=2-3, ghg=1 by largest-remainder)
# to test whether the ssp370 bias tracks batch share, at the cost of a weaker
# aaer signal (watch aaer patcorr doesn't relapse toward 0.08-0.42).
scenario_weights:
  - 2  # hist
  - 3  # ssp370 (2→3: A/B probe for batch-share-driven ssp370 warm+wet bias)
  - 3  # aaer   (4→3: gives ssp370 its slot back; watch aaer patcorr for relapse)
  - 1  # ghg

# ── Year-biased window sampling ──────────────────────────────
# Bias window draws toward later (higher-emission) years to compensate for
# four scenarios all sharing the low-emission 1850-2014 historical period,
# which oversamples early years across the dataset.
# Global-axis weight: w(y) ∝ ((y - y_min)/(y_max - y_min) + floor)^year_bias
# where y_min/y_max span ALL experiments (e.g. 1850-2100), so hist 2014 and
# ssp370 2015 receive nearly identical weight — no sampling discontinuity at
# the hist→ssp boundary.
#   year_bias = 0.0  → uniform (off)
#   year_bias = 1.0  → linear ramp (early year ≈ floor× the late year)
#   year_bias = 2.0  → quadratic (stronger late-year emphasis)
# Floor keeps early years > 0 probability so they are still seen.
year_bias: 0.0
year_bias_floor: 0.1

# ── BSP (binary-space-partition) period sampler ───────────────
# When bsp_depth > 0, each experiment's window pool is split into
# 2^bsp_depth equal-width year buckets and the epoch's index pool is
# round-robin-interleaved so every (n_buckets) consecutive samples
# cover all non-empty buckets. Guarantees that hist/ghg/aaer regularly
# see early-period (1850-1950) windows even when those buckets are
# small. Empty buckets per experiment (e.g. ssp* < 2015) are skipped.
#   bsp_depth = 0  → disabled
#   bsp_depth = 3  → 8 buckets per experiment (~31-yr each over 1850-2100)
bsp_depth: 0

