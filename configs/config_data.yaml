# conf/dataset/multi_experiment_train.yaml
# ============================================================
#  Multi-experiment training dataloader config
#  Scenarios : hist, ssp370, AAER, GHG
#  Realizations : 21 / 30  (70 % train split)
#  Batch : 8 total = 2 windows × 4 scenarios per batch
# ============================================================

_target_: multi_experiment_dataset.build_multi_experiment_loader

# ── Shared ClimateDataset kwargs ─────────────────────────────
seq_len: 1
target_vars:
  - TREFHT
cond_vars:
  - CO2
  - SUL
n_components_target: null
n_components_cond: null

# ── Loader settings ──────────────────────────────────────────
batch_size: 12          # 4 scenarios × 2 windows — increase to 16 if VRAM allows
mix_scenarios: true    # guarantees cross-scenario batches (critical for conditioning)
steps_per_realization: null  # use all available windows per realization

# ── Per-experiment configs ────────────────────────────────────
experiment_configs:

  - scenario_name: hist
    time_dim: time
    data_dir: /scratch/project_462001112/emulator_data/training_data/TREFHT/hist
    cond_file: /scratch/project_462001112/emulator_data/emissions_hist_timefixed.nc
    realizations:
      - LE2-1001.001
      - LE2-1011.001
      - LE2-1021.002
