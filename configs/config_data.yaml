# conf/dataset/multi_experiment_train.yaml
# ============================================================
#  Multi-experiment training dataloader config
#  Scenarios : hist, ssp370, AAER, GHG
#  Realizations : 21 / 30  (70 % train split)
#  Batch : 16 total = 4 windows × 4 scenarios per batch
# ============================================================

_target_: multi_experiment_dataset.build_multi_experiment_loader

# ── Shared ClimateDataset kwargs ─────────────────────────────
seq_len: 1
target_vars:
  - TREFHT
cond_vars:
  - CO2
  - SUL
n_components_target: null
n_components_cond: [30, 5]    # [CO2, SUL]: 5 SUL EOFs (down from 10) — drops CEDS↔IAMC 2015-junction EOF that caused the aaer 2015 temperature spike after ep ~610

# ── Loader settings ──────────────────────────────────────────
batch_size: 8           # 16→8: per_exp=2 (vs 4) so n_batches doubles → ≥16/realization for 16-rank DDP sharding
mix_scenarios: true    # guarantees cross-scenario batches (critical for conditioning)
steps_per_realization: 1000  # fewer realization switches = less Lustre I/O stalling GPUs

# ── Per-scenario sampling weights ────────────────────────────
# ssp370 weighted 2× to over-sample the high-forcing, CO2+aerosol-coupled
# regime that dominates the TCRE warm bias.  With batch_size=16 and weights
# [1,2,1,1] largest-remainder rounding yields hist=3, ssp370=7, aaer=3, ghg=3.
# The slope-match TCRE loss still sees the full CO2 range every batch
# (hist low → ssp370/ghg high).
scenario_weights:
  - 1  # hist
  - 1  # ssp370
  - 1  # aaer
  - 1  # ghg

# ── Year-biased window sampling ──────────────────────────────
# Bias window draws toward later (higher-emission) years to compensate for
# four scenarios all sharing the low-emission 1850-2014 historical period,
# which oversamples early years across the dataset.
# Global-axis weight: w(y) ∝ ((y - y_min)/(y_max - y_min) + floor)^year_bias
# where y_min/y_max span ALL experiments (e.g. 1850-2100), so hist 2014 and
# ssp370 2015 receive nearly identical weight — no sampling discontinuity at
# the hist→ssp boundary.
#   year_bias = 0.0  → uniform (off)
#   year_bias = 1.0  → linear ramp (early year ≈ floor× the late year)
#   year_bias = 2.0  → quadratic (stronger late-year emphasis)
# Floor keeps early years > 0 probability so they are still seen.
year_bias: 0.0
year_bias_floor: 0.1

# ── BSP (binary-space-partition) period sampler ───────────────
# When bsp_depth > 0, each experiment's window pool is split into
# 2^bsp_depth equal-width year buckets and the epoch's index pool is
# round-robin-interleaved so every (n_buckets) consecutive samples
# cover all non-empty buckets. Guarantees that hist/ghg/aaer regularly
# see early-period (1850-1950) windows even when those buckets are
# small. Empty buckets per experiment (e.g. ssp* < 2015) are skipped.
#   bsp_depth = 0  → disabled
#   bsp_depth = 3  → 8 buckets per experiment (~31-yr each over 1850-2100)
bsp_depth: 0

