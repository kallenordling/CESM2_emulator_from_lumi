# conf/dataset/multi_experiment_train.yaml
# ============================================================
#  Multi-experiment training dataloader config
#  Scenarios : hist, ssp370, AAER, GHG
#  Realizations : 21 / 30  (70 % train split)
#  Batch : 8 total = 2 windows × 4 scenarios per batch
# ============================================================

_target_: multi_experiment_dataset.build_multi_experiment_loader

# ── Shared ClimateDataset kwargs ─────────────────────────────
seq_len: 1
target_vars:
  - TREFHT
cond_vars:
  - CO2
  - SUL
n_components_target: null
n_components_cond: [30, 10]   # [CO2, SUL]: 10 SUL EOFs remove shipping-lane artefacts

# ── Loader settings ──────────────────────────────────────────
batch_size: 8           # total windows per batch; lowered from 12 to fit TCRE extra forward pass
mix_scenarios: true    # guarantees cross-scenario batches (critical for conditioning)
steps_per_realization: 1000  # fewer realization switches = less Lustre I/O stalling GPUs

# ── Per-scenario sampling weights ────────────────────────────
# Upweight aaer and ghg (single-forcing experiments) to give the model
# more gradient signal to disentangle CO2 vs aerosol responses.
# With batch_size=12 and weights [1,2,2,2] → hist:2, ssp370:4, aaer:4, ghg:4
# ssp370 upweighted to 2× to give more gradient signal at high cumulative CO2 where over-response is worst
scenario_weights:
  - 1  # hist
  - 2  # ssp370 (2× — high cumulative CO2 regime, worst over-response; only 86 years vs hist 165)
  - 2  # aaer   (2× — only 9 members, CO2-aerosol collinearity fix)
  - 2  # ghg    (2× — only 9 members, CO2-aerosol collinearity fix)

# ── Per-experiment configs ────────────────────────────────────
experiment_configs:

  - scenario_name: hist
    time_dim: time
    data_dir: /scratch/project_462001328/emulator_data/training_data/TREFHT/hist
    cond_file: /scratch/project_462001328/emulator_data/emissions_hist_timefixed.nc
    realizations:
      - LE2-1001.001
      - LE2-1011.001
      - LE2-1021.002
      - LE2-1031.002
      - LE2-1041.003
      - LE2-1051.003
      - LE2-1061.004
      - LE2-1071.004
      - LE2-1081.005
      - LE2-1091.005
      - LE2-1101.006
      - LE2-1111.006
      - LE2-1121.007
      - LE2-1131.007
      - LE2-1141.008
      - LE2-1151.008
      - LE2-1161.009
      - LE2-1171.009
      - LE2-1181.010
      - LE2-1191.010
      # LE2-1231.001 held out for validation

