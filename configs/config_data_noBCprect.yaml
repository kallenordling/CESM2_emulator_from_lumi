# conf/dataset/multi_experiment_train.yaml
# ============================================================
#  Multi-experiment training dataloader config
#  Scenarios : hist, ssp370, AAER, GHG
#  Realizations : 21 / 30  (70 % train split)
#  Batch : 16 total = 4 windows × 4 scenarios per batch
# ============================================================
#
# A/B FORK (2026-08-02, run_gainfix_noBCprect.sh): rigorous single-variable
# test of whether BC (3rd cond channel) + PRECT (2nd target channel) cause the
# run_gainfix persistent ssp370 warm+wet bias (GMbias +0.21..+0.29 tail degC).
# The previous run_sensfix/run_mseyb comparison used for this was RETRACTED
# (see memory gainfix_ssp370_persistent_bias.md) — mseyb differs from gainfix
# in 5+ variables at once (mse_only, year_bias data config, SGAIN presence,
# LR decay, BC/PRECT), so it could not isolate BC/PRECT's contribution. This
# config changes ONLY target_vars/cond_vars/n_components_cond/cond_smooth_sigma
# (TREFHT-only output, CO2+SUL-only cond, dropping PRECT/BC) and the paired
# data_dir entries; scenario_weights, year_bias, bsp_depth, cond files, and
# realizations are all byte-identical to config_data.yaml. The run script
# (run_gainfix_noBCprect.sh) keeps every trainer.hyperparameters setting
# (sampled_gain, lr_decay, mse_only=false, etc.) identical to run2_gainfix.sh
# except model in/out/cond channels (2/2/3 -> 1/1/2, forced fresh training —
# conv shapes differ from any existing checkpoint).
#
# cond_file paths still point at the *_timefixed_bc.nc files (contain a BC
# variable) — harmless, ClimateDataset selects only cond_vars via
# raw_cond[self.cond_vars] (data/climate_dataset.py:703), so BC is simply
# never read. No new cond files needed.

_target_: multi_experiment_dataset.build_multi_experiment_loader

# ── Shared ClimateDataset kwargs ─────────────────────────────
seq_len: 1
target_vars:
  - TREFHT                    # PRECT dropped for this A/B — see header
cond_vars:
  - CO2
  - SUL                       # BC dropped for this A/B — see header
n_components_target: null
n_components_cond: [30, 5]    # [CO2, SUL] — BC's 5 EOFs dropped
# Per-channel spatial gaussian σ (gridpoints) applied to normalised cond fields
# before PCA. CO2 is already smooth (cumulative emissions); SUL needs smoothing
# to suppress shipping-lane/flight-path inventory artefacts that the model would
# otherwise reproduce as line features in the predicted TREFHT.
cond_smooth_sigma: [0, 2]     # [CO2, SUL] — BC's σ dropped
# Denoiser for the smoothing above: "gaussian" (blurs all scales — also erases
# the regional aerosol fingerprint, see model_skill_diagnosis: aaer patcorr 0.42)
# or "median" (k=2*round(sigma)+1 kernel; removes thin shipping/flight lines but
# preserves broad continental aerosol structure). Production = gaussian.
cond_smooth_method: gaussian

# ── Loader settings ──────────────────────────────────────────
batch_size: 8           # 16→8: per_exp=2 (vs 4) so n_batches doubles → ≥16/realization for 16-rank DDP sharding
mix_scenarios: true    # guarantees cross-scenario batches (critical for conditioning)
steps_per_realization: 1000  # fewer realization switches = less Lustre I/O stalling GPUs

# ── Per-scenario sampling weights — IDENTICAL to config_data.yaml ────────────
scenario_weights:
  - 2  # hist
  - 2  # ssp370
  - 4  # aaer
  - 1  # ghg

# ── Year-biased window sampling — IDENTICAL to config_data.yaml ──────────────
year_bias: 0.0
year_bias_floor: 0.1

# ── BSP (binary-space-partition) period sampler — IDENTICAL ──────────────────
bsp_depth: 0

# ── Per-experiment configs ────────────────────────────────────
# data_dir now a single-element list (TREFHT tree only, PRECT dropped).
# cond_file unchanged (BC variable present but unused — see header).
experiment_configs:

  - scenario_name: hist
    time_dim: time
    data_dir:
      - /scratch/project_462001328/emulator_data/training_data/TREFHT/hist
    cond_file: /scratch/project_462001328/emulator_data/emissions_hist_only_timefixed_bc.nc
