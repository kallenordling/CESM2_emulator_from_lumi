# ============================================================
#  MONTHLY multi-experiment training dataloader
# ============================================================
# Fork of config_data_ybias_BCprect.yaml for the monthly-temporal branch.
# Three changes, everything else byte-identical:
#
#  1. seq_len: 1 -> 12
#     Twelve MONTHLY frames per sample, not twelve output channels. The model
#     keeps out_channels: 2 (TREFHT, PRECT); the frame dimension is what grows,
#     so cost scales ~12x with frames and not at all with the second variable.
#     video_net's temporal attention (rotary + RelativePositionBias) is wired
#     already and is simply inert at f=1 — this is what activates it.
#
#  2. prev_target_channel: true  -> cond_channels 3 -> 4 in the MODEL config.
#     Appends the previous timestep's TREFHT so the model has somewhere to
#     carry memory. Measured motivation (scripts/diag_interannual.py): emulator
#     lag-1 autocorrelation -0.028 vs CESM2 +0.435. CESM2's lag-2 is only
#     +0.077 — well under the 0.189 an AR(1) with phi=0.435 implies — so one
#     previous step carries almost all of it.
#
#  3. DATA MUST BE MONTHLY. Build it with
#        python get_data.py --monthly --skip-existing
#     and point data_dir at the monthly trees. With annual data this config
#     trains on 12-year windows, which is not the intent.
#     Size: 2.65 MB per member-year per variable, so hist+ssp370 (251 yr) is
#     ~1.33 GB per member for TREFHT+PRECT, ~66 GB for all 50 members.
#
# SCENARIO COVERAGE — get_data.py only fetches hist and ssp370 (AWS
# 'atm.historical.monthly.cmip6' / 'atm.ssp370.monthly.cmip6'). AAER and GHG
# come from OSDF via download_cesm_lens_sf.py, which downloads RAW monthly
# files and does no aggregation, so those are already monthly at the source —
# it is the staging step that made the current trees annual (verified: the
# tree files carry integer `time` with units=year). All four scenarios must be
# re-staged monthly before this config trains on the full set; with only
# hist+ssp370 present, drop the aaer/ghg entries below.
#
# NOTE _select_years subsamples years for annual training; the previous-state
# channel REQUIRES an evenly spaced axis and will raise otherwise. On monthly
# data the axis is contiguous months, which satisfies it.
#
# MEMORY: 12 frames at batch_size 8 will not fit. Drop batch_size to 1 and
# raise gradient_accumulation_steps to 16 to hold the effective batch at 256
# (see memory: batch_size_guidance, node_count_lr_tradeoff), and turn on
# gradient checkpointing — use_checkpoint threads through 20 sites in
# video_net.py but appears in no config, so it is currently unused headroom.
# ============================================================

_target_: multi_experiment_dataset.build_multi_experiment_loader

# ── Shared ClimateDataset kwargs ─────────────────────────────
seq_len: 12
prev_target_channel: true
target_vars:
  - TREFHT
  - PRECT                     # added for this fork — see header
cond_vars:
  - CO2
  - SUL
  - BC                        # added for this fork — see header
n_components_target: null
n_components_cond: [30, 5, 5] # [CO2, SUL, BC] — matches config_data.yaml
# Per-channel spatial gaussian σ (gridpoints) applied to normalised cond fields
# before PCA. CO2 is already smooth (cumulative emissions); SUL needs smoothing
# to suppress shipping-lane/flight-path inventory artefacts that the model would
# otherwise reproduce as line features in the predicted TREFHT.
cond_smooth_sigma: [0, 2, 2]   # [CO2, SUL, BC] — matches config_data.yaml
# Denoiser for the smoothing above: "gaussian" (blurs all scales — also erases
# the regional aerosol fingerprint, see model_skill_diagnosis: aaer patcorr 0.42)
# or "median" (k=2*round(sigma)+1 kernel; removes thin shipping/flight lines but
# preserves broad continental aerosol structure). Production = gaussian.
cond_smooth_method: gaussian

# ── Loader settings ──────────────────────────────────────────
batch_size: 1           # must match config_aero_monthly.yaml; 12 frames do not fit at 8 (see the MEMORY note above)
mix_scenarios: true    # guarantees cross-scenario batches (critical for conditioning)
steps_per_realization: 1000  # fewer realization switches = less Lustre I/O stalling GPUs

# ── Per-scenario sampling weights — IDENTICAL to config_data_ybias.yaml ──────
scenario_weights:
  - 2  # hist
  - 2  # ssp370
  - 4  # aaer
  - 1  # ghg

# ── Year-biased window sampling — IDENTICAL to config_data_ybias.yaml ────────
year_bias: 1.0          # MSE+ybias arm: up-weight high-emission years (vs 0.0 uniform). Floor 0.1 → late ~10x early.
year_bias_floor: 0.1

# ── BSP (binary-space-partition) period sampler — IDENTICAL ──────────────────
bsp_depth: 0

# ── Per-experiment configs ────────────────────────────────────
# data_dir is now a LIST (TREFHT + PRECT trees, paired by realization dir
# name — same convention as config_data.yaml). cond_file switched to the
# *_bc.nc variants (contain BC; CO2/SUL values identical to the non-bc files
# used by config_data_ybias.yaml).
experiment_configs:

  - scenario_name: hist
    time_dim: time
    data_dir:
      - /scratch/project_2019839/emulator_data/training_data_monthly/TREFHT/hist
      - /scratch/project_2019839/emulator_data/training_data_monthly/PRECT/hist
    cond_file: /scratch/project_2019839/emulator_data/emissions_hist_only_timefixed_bc_co2fix.nc
    realizations:
      # MONTHLY MEMBER SET (2026-08-19). The monthly download took a
      # DIFFERENT subset from the annual trees — get_data.py --max-members
      # keeps the first N LEXICALLY sorted ids — so only 1001.001 and
      # 1181.010 overlap the annual list. These are the members that
      # actually exist on disk. LE2-1231.001 is the held-out validation
      # member and appears in the val block ONLY.
      - LE2-1001.001
      - LE2-1181.010
      - LE2-1251.001
      - LE2-1251.010
      - LE2-1281.001
      - LE2-1281.010
      - LE2-1301.001
      - LE2-1301.010
      - LE2-1231.010

  - scenario_name: ssp370
    time_dim: time
    data_dir:
      - /scratch/project_2019839/emulator_data/training_data_monthly/TREFHT/ssp370
      - /scratch/project_2019839/emulator_data/training_data_monthly/PRECT/ssp370
    cond_file: /scratch/project_2019839/emulator_data/emissions_ssp370_only_timefixed_bc_co2fix.nc
    realizations:
      # MONTHLY MEMBER SET (2026-08-19). The monthly download took a
      # DIFFERENT subset from the annual trees — get_data.py --max-members
      # keeps the first N LEXICALLY sorted ids — so only 1001.001 and
      # 1181.010 overlap the annual list. These are the members that
      # actually exist on disk. LE2-1231.001 is the held-out validation
      # member and appears in the val block ONLY.
      - LE2-1001.001
      - LE2-1181.010
      - LE2-1251.001
      - LE2-1251.010
      - LE2-1281.001
      - LE2-1281.010
      - LE2-1301.001
      - LE2-1301.010
      - LE2-1231.010

  - scenario_name: aaer
    time_dim: time
    data_dir:
      - /scratch/project_2019839/emulator_data/training_data_monthly/TREFHT/AAER
      - /scratch/project_2019839/emulator_data/training_data_monthly/PRECT/AAER
    cond_file: /scratch/project_2019839/emulator_data/emissions_aaer_only_timefixed_bc_co2fix.nc
    realizations:
      - "001"
      - "002"
      - "003"
      - "004"
      - "005"
      - "006"
      - "007"
      - "008"
      - "009"
      # "010" held out for validation

  - scenario_name: ghg
    time_dim: time
    data_dir:
      - /scratch/project_2019839/emulator_data/training_data_monthly/TREFHT/GHG
      - /scratch/project_2019839/emulator_data/training_data_monthly/PRECT/GHG
    cond_file: /scratch/project_2019839/emulator_data/emissions_ghg_only_timefixed_bc_co2fix.nc
    realizations:
      - "001"
      - "002"
      - "003"
      - "004"
      - "005"
      - "006"
      - "007"
      - "008"
      - "009"
      # "010" held out for validation

