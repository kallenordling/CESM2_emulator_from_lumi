# Monthly fork of config_aero.yaml — see configs/config_data_monthly.yaml.
# Only cond_channels changes (3 -> 4 for the previous-state channel);
# in_channels/out_channels stay 2, since 12 months is a FRAME dimension.
# Where to put checkpoints, logs, and a copy of this config
output_dir: runs/test_run
seed: 1337

# Path to the data config file (relative to configs/ directory)
# MUST be the monthly one: config_data.yaml is the ANNUAL fork and also points
# at LUMI paths, so this config paired with it trains on the wrong data (or, on
# Roihu, dies on a missing /scratch/project_462001328).
data_config: config_data_monthly.yaml

# Accelerate initialization kwargs
accelerator:
    mixed_precision: bf16
    split_batches: False
    # 2 -> 16: batch_size drops 8 -> 1 for seq_len 12, so accumulation makes up
    # the effective batch (see the MEMORY note in config_data_monthly.yaml).
    gradient_accumulation_steps: 16
    device_placement: True
    sync_batchnorm: False

model:
    _target_: models.video_net.UNetModel3D
    in_channels: 2        # was 1 — (TREFHT, PRECT) joint-denoised target
    out_channels: 2       # was 1
    cond_channels: 4      # (CO2, SUL, BC) + previous-step TREFHT
                      # set prev_target_channel: false in the data
                      # config and put this back to 3 to disable
    dim_mults: [1, 2, 3, 4]
    resnet_groups: 8
    attn_dim_head: 32
    attn_heads: 8
    init_kernel_size: 7
    model_dim: 96
    # Gradient checkpointing: recompute block activations in the backward pass
    # instead of holding them. Threads through 20 sites in video_net.py and
    # appears in no other config. LEFT OFF: the sweep that appeared to demand it
    # (job 696628) was invalid — all 4 ranks shared cuda:0, so its OOMs measured
    # contention, not capacity. At batch 1 seq_len 12 peaks at ~41 GiB on a
    # 95 GiB GH200, which fits, and checkpointing would cost ~a third more
    # compute per step for nothing. Turn on only if a rank-bound sweep says so.
    use_checkpoint: false

scheduler:
    _target_: custom_diffusers.continuous_ddpm.ContinuousDDPM
    beta_schedule: linear
    prediction_type: v_prediction
    clip_sample: false
    clip_range:
      - 4.5
      - 3.5

trainer:
  _target_: trainer.unetTrainer.UNetTrainer

  hyperparameters:
    max_epochs: 10000
    sample_every: 500
    save_every: 100
    # Force an eval every N epochs regardless of best VAL/Skill (which is an
    # unreliable gate — single-realization internal variability — so evals
    # otherwise stop once it plateaus). Keeps TCRE/bias tracked past the skill
    # peak. 0 = off (only best-skill evals).
    force_eval_every: 25
    # Diagnostic: when true, hold cond_loss_scaling=0 so ALL aux losses
    # (cond/TCRE/low-t/EBM/interaction) + the null pass are skipped → pure
    # denoising MSE. Used by the run_mseyb A/B arm (run2_mseyb.sh). Default off.
    mse_only: false
    # torch.compile mode. "default" is the safe one; "reduce-overhead"
    # adds CUDA graphs and is worth it only where kernel-launch overhead
    # dominates, which batch_size 1 makes plausible here. NVIDIA-only in
    # practice — measure the [EPOCH n] duration against "default" before
    # keeping it. TORCH_COMPILE=0 disables compilation entirely.
    # Progress line every N optimizer STEPS, same format as the
    # end-of-epoch one. An epoch is 2250 steps (~18 min) here, so
    # without this the log shows no timing until the epoch ends.
    progress_every: 100
    compile_mode: default
    # null = torch's own dynamic-shape handling. reduce-overhead REQUIRES
    # false: CUDA graphs cannot take a dynamic dim, and Inductor dies in
    # codegen on the downsampling symbol (job 744145).
    compile_dynamic: null
    batch_size: 1        # must match batch_size in config_data_monthly.yaml.
                         # 8 -> 1 from the measured per-sample peak, not from
                         # that job's OOMs (which were rank-contention — see
                         # use_checkpoint below): one sample at seq_len 12 peaks
                         # at 40.7 GiB, so batch 8 would need ~326 GiB against
                         # 95 GiB of GH200. Batch 2 (~81 GiB) is arithmetically
                         # close but untested; raise it only after a rank-bound
                         # sweep.
    save_dir: runs/
    save_name: run_monthly_bcprect.pt  # FRESH bundle for BC 3rd cond channel + PRECT 2nd output channel. Channel counts change (in/out 1→2, cond 2→3) so v0.1.0 TREFHT checkpoints will NOT load (conv shapes differ) — fresh name → starts from epoch 0.
    load_path: "newest"        # first link: no run_sensfix_*.pt exists → falls through to from-scratch; chained links resume newest
    lr: 0.00005
    # ── LR decay (pure function of global_step → resume-invariant; default off) ─
    # Cosine/linear decay from base `lr` (5e-5) to `lr_floor` (5e-6), reaching the
    # floor at lr_decay_horizon_steps (~ep1000 at ~20 steps/epoch). Computed in
    # _lr_for_step from self.global_step (already persisted/restored), so no new
    # checkpoint state and old ckpts just work. A/B fork: run2_lrdecay.sh.
    lr_decay: off            # off | cosine | linear  — enable via the fork scripts' CLI override (lr_decay=cosine); a bare yaml on/off parses as a BOOL, only "cosine"/"linear" strings activate decay
    lr_floor: 0.000005       # 5e-6
    lr_decay_horizon_steps: 20000
    sample_steps: 250
    cfg_drop_prob: 0.0
    cfg_co2_drop_prob: 0.2      # increased from 0.1 — more null-CO2 batches, less CO2 sensitivity
    cfg_sul_drop_prob: 0.3      # 3× SUL dropout → more CO2-only training batches
    cfg_bc_drop_prob: 0.3       # NEW — BC is an aerosol channel; match SUL so CO2-only batches stay frequent
    # Per-target-channel weight in the primary denoising MSE: [TREFHT, PRECT].
    # PRECT is noisier → downweight to 0.5 so it can't dominate / destabilise the
    # shared backbone. Default [1.0, 1.0] (or absent) = unchanged equal weighting.
    target_var_weights: [1.0, 0.5]
    adaptive_loss_scaling: true  # auto-tune cond/tcre scalings to fixed fractions of MSE loss
    cond_target_fraction: 0.30   # general conditioning loss target = 30% of MSE loss (bounded [0.1, 0.4])
    # ── TCRE regularization (physics prior) ──────────────────────────────
    # Slope precomputed from hist + ssp370 ΔT vs cumCO2 (matches eval).
    # Applied to the model's full predicted anomaly on hist + ssp370 samples.
    tcre_loss_scaling: 0.01      # initial value; adaptive scaling overrides once EMA warms
    tcre_target_fraction: 0.12   # (C) raised 0.05→0.12 to pull harder on the ~+13% TCRE overshoot
    # Quantity the slope-match scores: false = CFG decomposition (cond − null);
    # true = FULL anomaly (cond − climatology, what eval measures). The target
    # slopes are CESM2 full anomaly, so the decomposition form mismatches when
    # pred_x0_null drifts above the 1850-1900 baseline → eval ΔT-vs-cumCO2 too
    # steep (ssp370 b≈1.33). A/B-tested via run_tcrefulltest.sh; default off.
    tcre_full_anomaly: false
    # (B) Low-t TCRE: score the sensitivity constraint on an extra conditioned
    # forward at fixed low noise (one-step x0 ≈ true sample) instead of the
    # random-t one-step proxy that lets the sampled sensitivity overshoot ~+13%
    # (ssp370 whole-run warm, ghg tail/polar). Adds 1 fwd/optimizer-step on the
    # sync iter; uses full-anomaly scoring. See unified_sensitivity_overshoot.
    tcre_lowt: true
    tcre_lowt_level: 0.05
    # ── Energy-balance constraint  N = F + λ·ΔT  — DROPPED (disabled) ─────
    # Was: 3 learnable scalars (α_ghg, α_aero, λ) penalizing the squared
    # global-mean residual. Found near-inactive and TCRE-redundant: it drove
    # residual→0 (equilibrium N=0, not N_cesm=N_model), the coeffs are
    # scale-degenerate, and without CESM2 TOA flux the constraint reduces to a
    # λ-weighted ΔT match. Published feedbacks (Zelinka: CESM2 λ=-0.634, ECS=5.15)
    # only bound EQUILIBRIUM — far too loose for the transient sensitivity bias
    # (would need ~+170% over-warming to bind). Transient sensitivity is handled
    # by TCRE (low-t B+C). See memory ebm_term_near_inactive. Set to 0 to drop.
    ebm_loss_scaling: 0.0
    ebm_target_fraction: 0.05
    # ── Superposition (interaction) penalty  (strategy #2, ssp126 fix) ────
    # Enforces additive CO2+aerosol composition on hist (low-forcing) so the
    # model composes unseen low-forcing scenarios (ssp126) from its marginals
    # instead of over-warming when aerosols decline. 2 extra no-grad marginal
    # passes on the hist subset each sync step. Scaling adapts via EMA.
    interaction_loss_scaling: 0.01      # initial; adaptive scaling overrides once EMA warms
    interaction_target_fraction: 0.05
    # Also apply the interaction loss to ssp370, matching the model's global-mean
    # interaction to CESM2's MEASURED interaction (ssp370−ghg−aaer vs cumCO2)
    # rather than forcing additivity →0 (which is wrong at high forcing — the
    # joint response is genuinely sub-additive). Goal: a compositional operator
    # that generalizes to the unseen ssp126. Off by default; run_intssp A/B arm.
    interaction_match_ssp370: false
    # ── Global-mean supervision (direct, FIXED weight; default OFF) ──────────
    # Pins the predicted field's area-weighted global mean to the target's, per
    # sample, for ALL scenarios. Ordinary MSE under-weights the global mean, so
    # high-forcing scenarios over-warm beyond CESM2's envelope (ssp370 ~7σ, ghg
    # ~3σ, ssp126 ~20σ). Unlike TCRE (hist+ssp370, weak/adaptive), this is all-
    # scenario and a FIXED strong weight. A/B-tested via run_gmeantest.sh.
    gmean_loss_scaling: 0.0
    # ── Sampled-gain constraint (multiplicative TCRE on SAMPLED output) ──────
    # Every `sampled_gain_every_steps` optimizer steps: short-sample fixed probe
    # years (hist+ssp370 cond, full conditioning) with no_grad down to low noise,
    # then ONE grad-enabled denoise; penalize (sampled ΔT-vs-cumCO2 slope /
    # CESM2 slope − 1)² per scenario. Unlike tcre_lowt (noised GROUND TRUTH →
    # input already carries the answer → nearly vacuous), the low-t input here
    # comes from the model's own sampling chain, so the penalty sees the actual
    # sampled overshoot (~+29% hist at ep1000+, invisible to the one-step proxy).
    # FIXED weight (not adaptive). 0.0 = fully off (default; keeps live runs
    # unchanged). A/B fork: run2_gainfix.sh (scale 0.05).
    # Cost per invocation ≈ (steps−1) no-grad + 1 grad forward of ~2·probe_years
    # samples → ~+7%/epoch at every_steps=50.
    sampled_gain_loss_scale: 0.0
    sampled_gain_every_steps: 50
    sampled_gain_steps: 6
    sampled_gain_probe_years: 5
    # ── BC cond-channel clip mode (data/climate_dataset.py) ──────────────────
    # "v1" (default) = 5-95 percentiles over all gridpoints — keeps live runs
    # byte-identical. "populated" = hi anchor at the p90 of POSITIVE BC values
    # (≈½ the v1 anchor): measured temporal-contrast gain +16% hist / +59%
    # ssp370; ~11% of populated hotspot cores clip at +1 (SUL saturates 6.3%).
    # No linear anchor does better (scan 2026-07-03) — larger gains would need
    # a nonlinear transform, and log-scaling cond failed before (do not retry).
    # Changing this changes the BC channel's meaning → FRESH TRAINING ONLY.
    # The (lo,hi) actually used is persisted in checkpoints (COND_NORM) and
    # re-injected at eval AND on training resume, so both always match the
    # checkpoint's training run.
    # null = defer to the data config's bc_clip_mode key (default "v1"). Set a
    # string here (or via CLI override, as run2_gainfix.sh does) to force a
    # mode; a non-null value here WINS over the data config.
    bc_clip_mode: null

    reset_optimizer: false      # keep Adam momentum across chained links. First link starts from scratch via load_path:"newest" fallback (no run_normfix ckpt yet); subsequent links resume cleanly.
    eval_script: run_eval_aero.sh
    # Auto-eval-trigger (_spawn_eval → eval_triggers/*.json → watch_eval_triggers.sh
    # → sbatch run_eval_aero.sh) only knows CHECKPOINT/OUTPUT_DIR by default, so
    # it silently evaluates every checkpoint against the DEFAULT model/data
    # config (configs/config_aero.yaml + configs/config_data.yaml). For a run
    # whose model.{in,out,cond}_channels differ from the default (e.g. an A/B
    # arm dropping BC/PRECT), that produces a state_dict shape-mismatch crash
    # on EVERY auto-triggered eval — found 2026-08-04 when run_gainfix_noBCprect
    # trained 448 epochs with zero successful auto-evals. Set these to the
    # matching --model-config/--data-config paths for any run whose channel
    # set differs from production; null (default) = use eval_aero.py's own
    # hardcoded defaults, unchanged behavior for every existing run.
    eval_model_config: null
    eval_data_config: null

  optimizer:
    _target_: torch.optim.Adam
    _partial_: True
    betas: [0.9, 0.999]