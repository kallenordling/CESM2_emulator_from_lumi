scheduler:
    _target_: custom_diffusers.continuous_ddpm.ContinuousDDPM
    beta_schedule: linear
    prediction_type: v_prediction
    clip_sample: false
    clip_range:
      - 0
      - null
      
data_dir: /scratch/project_462001328/emulator_data/
n_components_target: null
n_components_cond: [30, 10]
save_dir: ./
guidance_scale: 1.0   # Joint CFG scale (both channels). Ignored when guidance_co2/sul are set.
guidance_co2: null    # Per-channel CFG scale for CO2 (set to float, e.g. 1.5, to enable)
guidance_sul: null    # Per-channel CFG scale for SUL (set to float, e.g. 1.5, to enable)
# Seed for random number generators
seed: 42
variables: ["TREFHT"]
load_path: /projappl/project_462001328/CESM2_emulator_from_lumi/runs/best_epoch_48.pt
gen_mode: gen  # Either gen/val/test
batch_size: 8
sample_steps: 1000
start_year: 1850
end_year: 2100
save_name: ssp370_aero # Only set a save name if you want something special added to your save path
samples_per: 10
cond_file: emissions_new.nc #emissions.nc
sul_mul: 0
co2_mul: 1
dataset:
  _target_: data.climate_dataset.ClimateDataset
  seq_len: 1

accelerator:
    mixed_precision: bf16

